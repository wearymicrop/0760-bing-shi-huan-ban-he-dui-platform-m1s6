{% extends 'base.html' %}
{% block table_title %}开闭场时段{% endblock %}
{% block feature %}
<section class="panel proof"><div class="panel-top"><h2>冰面日历</h2></div>
  <div class="index-strip">{% for rink,rows in view.rows|groupby('key') %}<button class="index" type="button" data-booking="{{ rink }}">{{ rink }}<b>{{ rows|length }} 段</b></button>{% endfor %}</div>
</section>
{% endblock %}
