services:
  app:
    build: .
    ports:
      - "127.0.0.1:${RINK_PORT:-18454}:8000"
    environment:
      RINK_DB: /data/shifts.db
    volumes:
      - shifts:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 8
volumes:
  shifts:
